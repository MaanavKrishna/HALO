name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    name: Data pipeline (pytest + reproducible data)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: python -m pip install -r requirements.txt pytest
      - name: Tests
        run: python -m pytest -q
      - name: Web data rebuilds from the raw NASA files
        run: |
          python -m halo_pipeline.cli all
          git -C .. status --short -- web/src/data
          # Every file must rebuild byte for byte, except the bootstrap model fit (floats differ across
          # BLAS builds) and the manifest that hashes it; those two are compared below.
          git -C .. diff --exit-code -- web/src/data ':(exclude)web/src/data/manifest.json' ':(exclude)web/src/data/extinction.json'
          python - <<'PY'
          import json, math, subprocess

          def committed(name):
              return json.loads(subprocess.check_output(["git", "-C", "..", "show", f"HEAD:web/src/data/{name}"]))

          def close(a, b, path="extinction"):
              if isinstance(a, dict) and isinstance(b, dict):
                  assert a.keys() == b.keys(), f"{path}: keys differ"
                  for k in a:
                      close(a[k], b[k], f"{path}.{k}")
              elif isinstance(a, list) and isinstance(b, list):
                  assert len(a) == len(b), f"{path}: lengths differ"
                  for i, (x, y) in enumerate(zip(a, b)):
                      close(x, y, f"{path}[{i}]")
              elif isinstance(a, (int, float)) and isinstance(b, (int, float)) and not isinstance(a, bool):
                  assert math.isclose(a, b, rel_tol=1e-3, abs_tol=1e-6), f"{path}: {a} vs {b}"
              else:
                  assert a == b, f"{path}: {a!r} vs {b!r}"

          close(json.load(open("../web/src/data/extinction.json")), committed("extinction.json"))
          print("extinction.json matches within tolerance")

          new = json.load(open("../web/src/data/manifest.json"))
          old = committed("manifest.json")
          for m in (new, old):
              m.pop("builtAt", None)
              m["files"].pop("extinction.json", None)
          for k in sorted(set(new) | set(old)):
              if new.get(k) != old.get(k):
                  print(f"manifest[{k}]: committed={old.get(k)!r} rebuilt={new.get(k)!r}")
          assert new == old, "manifest.json differs from a fresh rebuild"
          print("manifest matches (builtAt ignored)")
          PY

  web:
    name: Web (types, unit tests, build, end-to-end)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm exec next typegen && pnpm exec tsc --noEmit
      - name: Unit tests
        run: pnpm test
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: End-to-end (builds and serves the production app)
        run: pnpm test:e2e
        env:
          SI_LIVE: "false"
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-results
          path: web/test-results
          retention-days: 7

  secrets:
    name: Secret scan (full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
