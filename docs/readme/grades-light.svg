<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="330" viewBox="0 0 1600 330" role="img" aria-label="Readiness grades on the full dataset: Artemis Base D, ISS B, Moon envelope C, Rover C, EVA suit F. Grades describe evidence coverage, not safety."><style>.s{font-family:Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif}.m{font-family:'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace}.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.8s cubic-bezier(.65,0,.25,1) forwards}@keyframes draw{to{stroke-dashoffset:0}}@media (prefers-reduced-motion:reduce){.draw{animation:none;stroke-dashoffset:0}}</style><rect x=".75" y=".75" width="1598.5" height="328.5" rx="22" fill="#fcfbf8" stroke="#1c1a14" stroke-opacity="0.24" stroke-width="1.5"/><text x="48" y="62" class="m" font-size="16" fill="#585c66" letter-spacing="2">READINESS GRADE · FULL DATASET</text><text x="1552" y="62" class="m" font-size="16" fill="#585c66" text-anchor="end" letter-spacing="2">GRADES DESCRIBE EVIDENCE COVERAGE, NOT SAFETY</text><circle cx="176" cy="168" r="58" fill="none" stroke="#1c1a14" stroke-opacity="0.19" stroke-width="7"/><circle cx="176" cy="168" r="58" fill="none" stroke="#8a5000" stroke-width="8" stroke-linecap="round" stroke-dasharray="145.8 364.4" transform="rotate(-90 176 168)" stroke-opacity="1"/><text x="176" y="192" class="s" font-size="64" font-weight="800" fill="#8a5000" text-anchor="middle" letter-spacing="-2">D</text><text x="176" y="270" class="s" font-size="24" font-weight="600" fill="#14161c" text-anchor="middle">Artemis Base</text><text x="176" y="300" class="m" font-size="14" fill="#585c66" text-anchor="middle">34% O2 · 8.2 psia</text><circle cx="488" cy="168" r="58" fill="none" stroke="#1c1a14" stroke-opacity="0.19" stroke-width="7"/><circle cx="488" cy="168" r="58" fill="none" stroke="#1f4fd6" stroke-width="8" stroke-linecap="round" stroke-dasharray="291.5 364.4" transform="rotate(-90 488 168)" stroke-opacity="1"/><text x="488" y="192