<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="660" viewBox="0 0 1280 660" role="img" aria-label="Architecture: NASA PSI (24 investigations, 22 tables plus the SAME workbook, CC0) to a Python pipeline (pandas, scikit-learn, 84 pytest tests) to a versioned JSON contract (1,967 rows in, 1,225 eligible, manifest sha256, zod-validated) to a pure TypeScript engine (evidence distance, grade rings 0.5, 1, 2) to facts with provenance, to the Fire Brief pages. Ask HALO branch: the LLM writes words only, a number validator passes it or a code-built fallback replaces it."><style>.s{font-family:Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif}.m{font-family:'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f4fd6"/></marker><marker id="aw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a5000"/></marker></defs><rect x=".75" y=".75" width="1278.5" height="658.5" rx="22" fill="#fcfbf8" stroke="#1c1a14" stroke-opacity=".20" stroke-width="1.5"/><circle cx="110" cy="560" r="120" fill="none" stroke="#1f4fd6" stroke-opacity=".10" stroke-width="1.5"/><circle cx="110" cy="560" r="80" fill="none" stroke="#1f4fd6" stroke-opacity=".14" stroke-width="1.5"/><circle cx="110" cy="560" r="40" fill="none" stroke="#1f4fd6" stroke-opacity=".20" stroke-width="1.5"/><circle cx="110" cy="560" r="5" fill="#1f4fd6" fill-opacity=".6"/><text x="40" y="56" class="m" font-size="14" fill="#585c66" letter-spacing="2">FIG 4.1 · DATA FLOW</text><text x="1240" y="56" class="m" font-size="14" fill="#1f4fd6" font-weight="700" text-anchor="end" letter-spacing="1">NUMBERS FROM CODE</text><text x="40" y="98" class="s" font-size="30" fill="#14161c" font-weight="800" letter-spacing="-0.8">From NASA’s archive to a cited sentence</text><rect x="40" y="130" width="186" height="250" rx="14" fill="#f4f3ef" stroke="#1f4fd6" stroke-opacity=".7" stroke-width="1.5"/><circle cx="200" cy="156" r="9" fill="none" stroke="#1c1a14" stroke-opacity=".2" stroke-width="2"/><circle cx="200" cy="156" r="9" fill="none" stroke="#1f4fd6" stroke-width="2" stroke-linecap="round" stroke-dasharray="9.4 56.5" transform="rotate(-90 200 156)"/><text x="56" y="161" class="m" font-size="12.5" fill="#585c66" letter-spacing="1.5">01 SOURCE</text><text x="56" y="202" class="s" font-size="24" fill="#1f4fd6" font-weight="800" letter-spacing="-0.6">NASA PSI</text><text x="56" y="238" class="s" font-size="15" fill="#4a4e58" xml:space="preserve">24 investigations</text><text x="56" y="262" class="s" font-size="15" fill="#4a4e58" xml:space="preserve">22 tables + SAME</text><text x="56" y="286" class="s" font-size="15" fill="#4a4e58" xml:space="preserve">workbook, CC0 1.0</text><rect x="56" y="330" width="154" height="1" fill="#1c1a14" fill-opacity=".20"/><text x="56" y="358" class="m" font-size="12.5" fill="#1f4fd6">psi.nasa.gov · vendored</text><line x1="228" y1="255.0" x2="242" y2="255.0" stroke="#1f4fd6" stroke-width="2" marker-end="url(#ah)"/><rect x="244" y="130" width="186" height="250" rx="14" fill="#ebe9e3" stroke="#1c1a14" stroke-opacity=".20" stroke-width="1.5"/><circle cx="404" cy="156" r="9" fill="none" stroke="#1c1a14" stroke-opacity=".2" stroke-width="2"/><circle cx="404" cy="156" r="9" fill="none" stroke="#1f4fd6" stroke-width="2" stroke-linecap="round" stroke-dasharray="18.8 56.5" transform="rotate(-90 404 156)"/><text x="260" y="161" class="m" font-size="12.5" fill="#585c66" letter-spacing="1.5">02 PIPELINE</text><text x="260" y="202" class="s" font-size="24" fill="#14161c" font-weight="800" letter-spacing="-0.6">Python</text><text x="260" y="238" class="s" font-size="15" fill="#4a4e58" xml:space="preserve">ingest · clean</text><text x="260" y="262" class="s" font-size="15" fill="#4a4e58" xml:space="preserve">provenance · models</text><text x="260" y="286" class="s" font-size="15" fill="#4a4e58" xml:space="preserve">FLEX extinction fit</text><rect x="260" y="330" width="154" height="1" fill="#1c1a14" fill-opacity=".20"/><text x="260" y="358" class="m" font-size="12.5" fill="#1f4fd6">pandas · scikit-learn</text><line x1="432" y1="255.0" x2="446" y2="255.0" stroke="#1f4fd6" stroke-width="2" marker-end="url(#ah)"/><rect x="448" y="130" width="186" height="250" rx="14" fill="#ebe9e3" stroke="#1c1a14" stroke-opacity=".20" stroke-width="1.5"/><circle cx="608" cy="156" r="9" fill="none" stroke="#1c1a14" stroke-opacity=".2" stroke-width="2"/><circle cx="608" cy="156" r="9" fill="none" stroke="#1f4fd6" stroke-width="2" stroke-linecap="round" stroke-dasharray="28.3 56.5" transform="rotate(-90 608 156)"/><text x="464" y="161" class="m" font-size="12.5" fill="#585c66" letter-spacing="1.5">03 CONTRACT</text><text x="464" y="202" class="s" font-size="24" fill="#14161c" font-weight="800" letter-spacing="-0.6">JSON</text><text x="464" y="238" class="s" font-size="15" fill="#4a4e58" xml:space="preserve">1,967 rows in</text><text x="464" y="262" class="s" font-size="15" fill="#4a4e58" xml:space="preserve">1,225 eligible</text><text x="464" y="286" class="s" font-size="15" fill="#4a4e58" xml:space="preserve">manifest sha256</text><rect x="464" y="330" width="154" height="1" fill="#1c1a14" fill-opacity=".20"/><text x="464" y="358" class="m" font-size="12.5" fill="#1f4fd6">zod-validated at build</text><line x1="636" y1="255.0" x2="650" y2="255.0" stroke="#1f4fd6" stroke-width="2" marker-end="url(#ah)"/><rect x="652" y="130" width="186" height="250" rx="14" fill="#ebe9e3" stroke="#1c1a14" stroke-opacity=".20" stroke-width="1.5"/><circle cx="812" cy="156" r="9" fill="none" stroke="#1c1a14" stroke-opacity=".2" stroke-width="2"/><circle cx="812" cy="156" r="9" fill="none" stroke="#1f4fd6" stroke-width="2" stroke-linecap="round" stroke-dasharray="37.7 56.5" transform="rotate(-90 812 156)"/><text x="668" y="161" class="m" font-size="12.5" fill="#585c66" letter-spacing="1.5">04 ENGINE</text><text x="668" y="202" class="s" font-size="24" fill="#14161c" font-weight="800" letter-spacing="-0.6">TypeScript</text><text x="668" y="238" class="s" font-size="15" fill="#4a4e58" xml:space="preserve">pure functions</text><text x="668" y="262" class="m" font-size="13.5" fill="#4a4e58" xml:space="preserve">d = √((ΔO2/10)²</text><text x="668" y="286" class="m" font-size="13.5" fill="#4a4e58" xml:space="preserve">     + (Δp/3)²)</text><rect x="668" y="330" width="154" height="1" fill="#1c1a14" fill-opacity=".20"/><text x="668" y="358" class="m" font-size="12.5" fill="#1f4fd6">rings 0.5 · 1 · 2</text><line x1="840" y1="255.0" x2="854" y2="255.0" stroke="#1f4fd6" stroke-width="2" marker-end="url(#ah)"/><rect x="856" y="130" width="186" height="250" rx="14" fill="#ebe9e3" stroke="#1c1a14" stroke-opacity=".20" stroke-width="1.5"/><circle cx="1016" cy="156" r="9" fill="none" stroke="#1c1a14" stroke-opacity=".2" stroke-width="2"/><circle cx="1016" cy="156" r="9" fill="none" stroke="#1f4fd6" stroke-width="2" stroke-linecap="round" stroke-dasharray="47.1 56.5" transform="rotate(-90 1016 156)"/><text x="872" y="161" class="m" font-size="12.5" fill="#585c66" letter-spacing="1.5">05 FACTS</text><text x="872" y="202" class="s" font-size="24" fill="#14161c" font-weight="800" letter-spacing="-0.6">Facts</text><text x="872" y="238" class="s" font-size="15" fill="#4a4e58" xml:space="preserve">every number has</text><text x="872" y="262" class="s" font-size="15" fill="#4a4e58" xml:space="preserve">a provenance badge</text><text x="872" y="286" class="s" font-size="15" fill="#4a4e58" xml:space="preserve">and a source</text><rect x="872" y="330" width="154" height="1" fill="#1c1a14" fill-opacity=".20"/><text x="872" y="358" class="m" font-size="12.5" fill="#1f4fd6">7 provenance kinds</text><line x1="1044" y1="255.0" x2="1058" y2="255.0" stroke="#1f4fd6" stroke-width="2" marker-end="url(#ah)"/><rect x="1060" y="130" width="186" height="250" rx="14" fill="#f4f3ef" stroke="#1f4fd6" stroke-opacity=".7" stroke-width="1.5"/><circle cx="1220" cy="156" r="9" fill="none" stroke="#1c1a14" stroke-opacity=".2" stroke-width="2"/><circle cx="1220" cy="156" r="9" fill="none" stroke="#1f4fd6" stroke-width="2" stroke-linecap="round" stroke-dasharray="56.5 56.5" transform="rotate(-90 1220 156)"/><text x="1076" y="161" class="m" font-size="12.5" fill="#585c66" letter-spacing="1.5">06 PAGES</text><text x="1076" y="202" class="s" font-size="24" fill="#1f4fd6" font-weight="800" letter-spacing="-0.6">Fire Brief</text><text x="1076" y="238" class="s" font-size="15" fill="#4a4e58" xml:space="preserve">grade, flags,</text><text x="1076" y="262" class="s" font-size="15" fill="#4a4e58" xml:space="preserve">ranked evidence,</text><text x="1076" y="286" class="s" font-size="15" fill="#4a4e58" xml:space="preserve">next test to fly</text><rect x="1076" y="330" width="154" height="1" fill="#1c1a14" fill-opacity=".20"/><text x="1076" y="358" class="m" font-size="12.5" fill="#1f4fd6">Next.js 16 · React 19</text><text x="337.0" y="406" class="m" font-size="12.5" fill="#585c66" text-anchor="middle">84 pytest tests</text><text x="847.0" y="406" class="m" font-size="12.5" fill="#585c66" text-anchor="middle">377 Vitest tests</text><text x="1153.0" y="406" class="m" font-size="12.5" fill="#585c66" text-anchor="middle">116 Playwright e2e</text><text x="300" y="436" class="m" font-size="13" fill="#585c66" letter-spacing="1.5">ASK HALO BRANCH · THE LLM WRITES WORDS, NEVER NUMBERS</text><path d="M949.0 418 V456 " fill="none" stroke="#1f4fd6" stroke-width="2" stroke-dasharray="5 5"/><path d="M949.0 456 H530 V470" fill="none" stroke="#1f4fd6" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#ah)"/><rect x="300" y="470" width="230" height="130" rx="12" fill="#ebe9e3" stroke="#1c1a14" stroke-opacity=".20" stroke-width="1.5"/><text x="316" y="504" class="s" font-size="18" fill="#14161c" font-weight="700">LLM narrative</text><text x="316" y="534" class="s" font-size="14" fill="#4a4e58">frozen facts in,</text><text x="316" y="556" class="s" font-size="14" fill="#4a4e58">cites fact ids [id]</text><rect x="580" y="470" width="260" height="130" rx="12" fill="#ebe9e3" stroke="#1c1a14" stroke-opacity=".20" stroke-width="1.5"/><text x="596" y="504" class="s" font-size="18" fill="#14161c" font-weight="700">Number validator</text><text x="596" y="534" class="s" font-size="14" fill="#4a4e58">each number must equal</text><text x="596" y="556" class="s" font-size="14" fill="#4a4e58">a fact value; a misfit</text><text x="596" y="578" class="s" font-size="14" fill="#4a4e58">citation means fallback</text><line x1="532" y1="535" x2="576" y2="535" stroke="#1f4fd6" stroke-width="2" marker-end="url(#ah)"/><path d="M842 510 H920" fill="none" stroke="#0a7350" stroke-width="2"/><path d="M842 565 H920" fill="none" stroke="#8a5000" stroke-width="2"/><text x="854" y="502" class="m" font-size="12.5" fill="#0a7350">pass</text><text x="854" y="557" class="m" font-size="12.5" fill="#8a5000">fail</text><rect x="920" y="488" width="250" height="46" rx="23" fill="none" stroke="#0a7350" stroke-width="1.5"/><text x="940" y="508" class="s" font-size="14.5" fill="#14161c" font-weight="700">Live answer</text><text x="940" y="525" class="m" font-size="12.5" fill="#585c66">source: live, chips cited</text><rect x="920" y="543" width="250" height="46" rx="23" fill="none" stroke="#8a5000" stroke-width="1.5"/><text x="940" y="563" class="s" font-size="14.5" fill="#14161c" font-weight="700">Code-built fallback</text><text x="940" y="580" class="m" font-size="12.5" fill="#585c66">deterministic, cites flags</text><path d="M1170 511 H1223.0 V420" fill="none" stroke="#1f4fd6" stroke-width="2" marker-end="url(#ah)"/><path d="M1170 566 H1223.0 V511" fill="none" stroke="#1f4fd6" stroke-width="2"/><text x="40" y="634" class="m" font-size="13" fill="#585c66">Same facts object feeds the page and the LLM; only code produces numbers.</text></svg>
