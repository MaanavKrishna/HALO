<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="600" viewBox="0 0 1280 600" role="img" aria-label="How a grade is computed: evidence distance d = square root of (delta O2 over 10) squared plus (delta pressure over 3) squared. Rings at d 0.5 (A or B), 1 (C) and 2 (D); F beyond. Artemis Base, 34% O2 and 8.2 psia: nearest real solid BASS-II at 22.2% O2, 14.7 psia, d 2.47, grade F; the ACME BRE surrogate at d 0 lifts it one step to D. A surrogate lifts the grade to C at most."><style>.s{font-family:Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif}.m{font-family:'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7ea6ff"/></marker><marker id="aw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f3b54d"/></marker></defs><rect x=".75" y=".75" width="1278.5" height="598.5" rx="22" fill="#0c1320" stroke="#aac3f0" stroke-opacity=".30" stroke-width="1.5"/><text x="40" y="56" class="m" font-size="14" fill="#8794aa" letter-spacing="2">FIG 4.2 · EVIDENCE DISTANCE</text><text x="1240" y="56" class="m" font-size="14" fill="#7ea6ff" font-weight="700" text-anchor="end" letter-spacing="1">web/src/lib/engine/grade.ts</text><circle cx="330" cy="345" r="184.0" fill="#f3b54d" fill-opacity=".07" stroke="#f3b54d" stroke-opacity=".75" stroke-width="1.5"/><circle cx="330" cy="345" r="92.0" fill="#7ea6ff" fill-opacity=".07" stroke="#7ea6ff" stroke-opacity=".75" stroke-width="1.5"/><circle cx="330" cy="345" r="46.0" fill="#4fd4a4" fill-opacity=".07" stroke="#4fd4a4" stroke-opacity=".75" stroke-width="1.5"/><line x1="60" y1="345" x2="600" y2="345" stroke="#aac3f0" stroke-opacity=".30"/><line x1="330" y1="80" x2="330" y2="570" stroke="#aac3f0" stroke-opacity=".30"/><text x="598" y="367" class="m" font-size="12.5" fill="#8794aa" text-anchor="end">O2 %  →</text><text x="338" y="95" class="m" font-size="12.5" fill="#8794aa">↑ pressure</text><text x="480.9939786636368" y="460.2817114599211" class="m" font-size="13" fill="#f3b54d" font-weight="700">D  d ≤ 2</text><text x="408.49698933181844" y="403.64085572996055" class="m" font-size="13" fill="#7ea6ff" font-weight="700">C  d ≤ 1</text><text x="372.2484946659092" y="375.3204278649803" class="m" font-size="13" fill="#4fd4a4" font-weight="700">A/B  d ≤ 0.5</text><text x="530" y="545" class="m" font-size="13" fill="#ff7a5c" font-weight="700">F  beyond 2</text><line x1="330" y1="345" x2="221.4" y2="145.8" stroke="#ff7a5c" stroke-width="2" stroke-dasharray="6 5"/><circle cx="221.4" cy="145.8" r="8" fill="#ff7a5c"/><text x="235.44" y="139.78933333333333" class="s" font-size="14" fill="#eef2f8" font-weight="700">BASS-II · PMMA film</text><text x="235.44" y="158.78933333333333" class="m" font-size="12.5" fill="#a3afc2">22.2% O2 · 14.7 psia</text><rect x="185.72000000000003" y="231.39466666666667" width="84" height="24" rx="12" fill="#0c1320" stroke="#ff7a5c" stroke-width="1.2"/><text x="227.72000000000003" y="248.39466666666667" class="m" font-size="12.5" fill="#ff7a5c" font-weight="700" text-anchor="middle">d = 2.47</text><circle cx="330" cy="345" r="17" fill="none" stroke="#7ea6ff" stroke-width="2" stroke-dasharray="4 3"/><circle cx="330" cy="345" r="7" fill="#7ea6ff"/><text x="352" y="323" class="s" font-size="15" fill="#eef2f8" font-weight="800">Artemis Base</text><text x="352" y="339" class="m" font-size="12.5" fill="#a3afc2">34% O2 · 8.2 psia</text><text x="308" y="387" class="m" font-size="12.5" fill="#7ea6ff" text-anchor="end">ACME BRE burner (surrogate), d = 0</text><text x="690" y="112" class="s" font-size="30" fill="#eef2f8" font-weight="800" letter-spacing="-0.8">How a grade is computed</text><text x="690" y="150" class="m" font-size="19" fill="#7ea6ff" font-weight="700">d = √((ΔO2 / 10)² + (Δp / 3)²)</text><text x="690" y="176" class="s" font-size="15" fill="#a3afc2">10 O2 points count the same as 3 psia.</text><rect x="690" y="197" width="26" height="24" rx="6" fill="none" stroke="#4fd4a4" stroke-width="1.5"/><text x="703" y="214" class="m" font-size="14" fill="#4fd4a4" font-weight="700" text-anchor="middle">A</text><text x="730" y="214" class="s" font-size="15" fill="#a3afc2">d ≤ 0.5, O2 and pressure both measured</text><rect x="690" y="227" width="26" height="24" rx="6" fill="none" stroke="#4fd4a4" stroke-width="1.5"/><text x="703" y="244" class="m" font-size="14" fill="#4fd4a4" font-weight="700" text-anchor="middle">B</text><text x="730" y="244" class="s" font-size="15" fill="#a3afc2">d ≤ 0.5</text><rect x="690" y="257" width="26" height="24" rx="6" fill="none" stroke="#7ea6ff" stroke-width="1.5"/><text x="703" y="274" class="m" font-size="14" fill="#7ea6ff" font-weight="700" text-anchor="middle">C</text><text x="730" y="274" class="s" font-size="15" fill="#a3afc2">d ≤ 1</text><rect x="690" y="287" width="26" height="24" rx="6" fill="none" stroke="#f3b54d" stroke-width="1.5"/><text x="703" y="304" class="m" font-size="14" fill="#f3b54d" font-weight="700" text-anchor="middle">D</text><text x="730" y="304" class="s" font-size="15" fill="#a3afc2">d ≤ 2</text><rect x="690" y="317" width="26" height="24" rx="6" fill="none" stroke="#ff7a5c" stroke-width="1.5"/><text x="703" y="334" class="m" font-size="14" fill="#ff7a5c" font-weight="700" text-anchor="middle">F</text><text x="730" y="334" class="s" font-size="15" fill="#a3afc2">beyond 2, or no test</text><text x="690" y="384" class="m" font-size="12.5" fill="#8794aa" letter-spacing="1.5">SURROGATE RULE</text><text x="690" y="408" class="s" font-size="15" fill="#a3afc2">A surrogate test inside the first ring lifts the</text><text x="690" y="428" class="s" font-size="15" fill="#a3afc2">grade one step, to C at most.</text><rect x="690" y="452" width="550" height="112" rx="14" fill="#141d2d" stroke="#aac3f0" stroke-opacity=".30"/><text x="708" y="478" class="m" font-size="12.5" fill="#8794aa" letter-spacing="1.5">WORKED EXAMPLE · ARTEMIS BASE</text><text x="708" y="506" class="s" font-size="15" fill="#eef2f8">Nearest real solid: BASS-II, d = 2.47</text><text x="708" y="532" class="s" font-size="15" fill="#eef2f8">BRE surrogate at d = 0, inside the first ring</text><rect x="1090" y="490" width="34" height="34" rx="8" fill="none" stroke="#ff7a5c" stroke-width="2"/><text x="1107" y="514" class="m" font-size="18" fill="#ff7a5c" font-weight="800" text-anchor="middle">F</text><line x1="1130" y1="507" x2="1166" y2="507" stroke="#7ea6ff" stroke-width="2" marker-end="url(#ah)"/><rect x="1172" y="490" width="34" height="34" rx="8" fill="#f3b54d" fill-opacity=".14" stroke="#f3b54d" stroke-width="2"/><text x="1189" y="514" class="m" font-size="18" fill="#f3b54d" font-weight="800" text-anchor="middle">D</text><text x="708" y="552" class="m" font-size="12.5" fill="#8794aa">one step up: grade D</text></svg>
