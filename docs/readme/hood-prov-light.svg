<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="230" viewBox="0 0 1280 230" role="img" aria-label="Provenance badges: measured (filled dot), inferred (half dot), assumed (hollow dot), literature (square), computed (diamond), model (dashed diamond), SI (dashed chip; LLM wording that never adds a number)."><style>.s{font-family:Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif}.m{font-family:'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace}</style><rect x=".75" y=".75" width="1278.5" height="228.5" rx="22" fill="#fcfbf8" stroke="#1c1a14" stroke-opacity=".20" stroke-width="1.5"/><text x="40" y="56" class="m" font-size="14" fill="#585c66" letter-spacing="2">PROVENANCE BADGES · ON EVERY NUMBER</text><text x="1240" y="56" class="m" font-size="14" fill="#1f4fd6" font-weight="700" text-anchor="end" letter-spacing="1">7 KINDS</text><circle cx="50.0" cy="112" r="7" fill="#0a7350" stroke="#0a7350" stroke-width="2"/><text x="68.0" y="118" class="m" font-size="17" fill="#14161c" font-weight="700">Measured</text><text x="40.0" y="156" class="s" font-size="13.5" fill="#4a4e58">Reported in the</text><text x="40.0" y="177" class="s" font-size="13.5" fill="#4a4e58">PSI data tables</text><path d="M221.42857142857142 105 A7 7 0 0 0 221.42857142857142 119 Z" fill="#1f4fd6"/><circle cx="221.42857142857142" cy="112" r="7" fill="none" stroke="#1f4fd6" stroke-width="2"/><text x="239.42857142857142" y="118" class="m" font-size="17" fill="#14161c" font-weight="700">Inferred</text><text x="211.42857142857142" y="156" class="s" font-size="13.5" fill="#4a4e58">Derived from other</text><text x="211.42857142857142" y="177" class="s" font-size="13.5" fill="#4a4e58">fields or the text</text><circle cx="392.85714285714283" cy="112" r="7" fill="none" stroke="#585c66" stroke-width="2"/><text x="410.85714285714283" y="118" class="m" font-size="17" fill="#14161c" font-weight="700">Assumed</text><text x="382.85714285714283" y="156" class="s" font-size="13.5" fill="#4a4e58">From the documented</text><text x="382.85714285714283" y="177" class="s" font-size="13.5" fill="#4a4e58">setup, not recorded</text><rect x="557.2857142857142" y="105" width="14" height="14" rx="1.5" fill="none" stroke="#4a4e58" stroke-width="2"/><text x="582.2857142857142" y="118" class="m" font-size="17" fill="#14161c" font-weight="700">Literature</text><text x="554.2857142857142" y="156" class="s" font-size="13.5" fill="#4a4e58">From a published</text><text x="554.2857142857142" y="177" class="s" font-size="13.5" fill="#4a4e58">paper or report</text><rect x="729.7142857142857" y="106" width="12" height="12" rx="1.5" fill="none" stroke="#4a4e58" stroke-width="2" transform="rotate(45 735.7142857142857 112)"/><text x="753.7142857142857" y="118" class="m" font-size="17" fill="#14161c" font-weight="700">Computed</text><text x="725.7142857142857" y="156" class="s" font-size="13.5" fill="#4a4e58">Arithmetic on the</text><text x="725.7142857142857" y="177" class="s" font-size="13.5" fill="#4a4e58">data: counts, d, pO2</text><rect x="901.1428571428571" y="106" width="12" height="12" rx="1.5" fill="none" stroke="#4a4e58" stroke-width="2" stroke-dasharray="3 2.5" transform="rotate(45 907.1428571428571 112)"/><text x="925.1428571428571" y="118" class="m" font-size="17" fill="#14161c" font-weight="700">Model</text><text x="897.1428571428571" y="156" class="s" font-size="13.5" fill="#4a4e58">FLEX extinction fit</text><text x="897.1428571428571" y="177" class="s" font-size="13.5" fill="#4a4e58">and its band</text><rect x="1068.5714285714284" y="101" width="30" height="22" rx="4" fill="#2f5ff0" fill-opacity=".12" stroke="#1f4fd6" stroke-width="1.5" stroke-dasharray="4 3"/><text x="1083.5714285714284" y="117" class="m" font-size="12.5" fill="#1f4fd6" font-weight="700" text-anchor="middle">SI</text><text x="1108.5714285714284" y="118" class="m" font-size="17" fill="#14161c" font-weight="700">SI</text><text x="1068.5714285714284" y="156" class="s" font-size="13.5" fill="#4a4e58">LLM wording; never</text><text x="1068.5714285714284" y="177" class="s" font-size="13.5" fill="#4a4e58">adds a number</text><text x="40" y="208" class="m" font-size="12.5" fill="#585c66">Shapes match the site’s ProvenanceBadge, so they still read in greyscale print.</text></svg>
