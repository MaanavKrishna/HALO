xt><text x="874" y="240" class="s" font-size="14.5" fill="#4a4e58">the model fit within tolerance.</text><rect x="40" y="278" width="386" height="176" rx="14" fill="#ebe9e3" stroke="#1c1a14" stroke-opacity=".20" stroke-width="1.2"/><circle cx="398" cy="306" r="10" fill="none" stroke="#1c1a14" stroke-opacity=".2" stroke-width="2"/><circle cx="398" cy="306" r="10" fill="none" stroke="#1f4fd6" stroke-width="2" stroke-linecap="round" stroke-dasharray="31.4 62.8" transform="rotate(-90 398 306)"/><text x="60" y="310" class="m" font-size="12.5" fill="#585c66" letter-spacing="1.5">LIVE-NASA CHECK</text><text x="58" y="362" class="s" font-size="44" fill="#1f4fd6" font-weight="800" letter-spacing="-1.5">24/24</text><text x="181" y="361" class="s" font-size="16" fill="#14161c" font-weight="700">datasets</text><text x="60" y="394" class="s" font-size="14.5" fill="#4a4e58">Raw files byte-identical to</text><text x="60" y="415" class="s" font-size="14.5" fill="#4a4e58">psi.nasa.gov; all 1,225</text><text x="60" y="436" class="s" font-size="14.5" fill="#4a4e58">eligible rows rechecked.</text><rect x="447" y="278" width="386" height="176" rx="14" fill="#ebe9e3" stroke="#1c1a14" stroke-opacity=".20" stroke-width="1.2"/><circle cx="805" cy="306" r="10" fill="none" stroke="#1c1a14" stroke-opacity=".2" stroke-width="2"/><circle cx="805" cy="306" r="10" fill="none" stroke="#1f4fd6" stroke-width="2" stroke-linecap="round" stroke-dasharray="20.9 62.8" transform="rotate(-90 805 306)"/><text x="467" y="310" class="m" font-size="12.5" fill="#585c66" letter-spacing="1.5">TESTS</text><text x="465" y="362" class="s" font-size="44" fill="#1f4fd6" font-weight="800" letter-spacing="-1.5">577</text><text x="547" y="361" class="s" font-size="16" fill="#14161c" font-weight="700">in CI</text><text x="467" y="394" class="s" font-size="14.5" fill="#4a4e58">pytest 84 · Vitest 377 ·</text><text x="467" y="415" class="s" font-size="14.5" fill="#4a4e58">Playwright 116 on the</text><text x="467" y="436" clas